# Netlify builds and serves the frontend; the Express API runs on Render.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API requests to the Render backend.
[[redirects]]
  from = "/api/*"
  to = "https://stadtwerke-plattling.onrender.com/api/:splat"
  status = 200
  force = true

# Proxy the feed and widget endpoints to the backend.
[[redirects]]
  from = "/feed.xml"
  to = "https://stadtwerke-plattling.onrender.com/feed.xml"
  status = 200
  force = true

[[redirects]]
  from = "/widget"
  to = "https://stadtwerke-plattling.onrender.com/widget"
  status = 200
  force = true

# React single-page application fallback. Keep this after the proxy rules.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Prevent the service worker from being cached.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
